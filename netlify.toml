# netlify.toml

[build]
  command = "npm run build"   # = astro check && astro build
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"         # package.json requires node >= 22.12.0

# ---------- Keep v1 URLs working (301 = permanent, tells Google to update) ----------

[[redirects]]
  from = "/main-page"
  to = "/"
  status = 301

[[redirects]]
  from = "/main-page/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/photos"
  to = "/#life"
  status = 301

[[redirects]]
  from = "/photos/*"
  to = "/#life"
  status = 301

[[redirects]]
  from = "/assets/current-resume-matthew-killeen.pdf"
  to = "/Matthew_Killeen_Resume.pdf"
  status = 301

# Browsers request /favicon.ico on their own; serve the portrait icon instead.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 301

# ---------- Caching ----------
# Astro puts hashed, never-changing files (JS, CSS, fonts, optimised images) in /_astro/.
# The file name changes whenever the content changes, so browsers can cache them forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
